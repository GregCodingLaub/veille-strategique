# ==============================================================================
# SOURCES CONFIG — add or remove sources here. No code changes needed for RSS.
# ==============================================================================
# Each source needs:
#   name:   display name
#   type:   "rss"     -> url must point directly to an RSS/Atom feed
#           "scrape"  -> url is a listing page; "parser" must match a function
#                        name in scripts/scrapers.py (custom code required)
#           "bluesky" -> url is actually a Bluesky HANDLE (e.g. "csis.org"),
#                        not a link. Use this for institutions whose own site
#                        blocks RSS scraping (Cloudflare, broken certs, no
#                        feed) but who post their publications on Bluesky.
#   url:    the feed URL (rss), listing page URL (scrape), or handle (bluesky)
#   region: fr | eu | us | other   (for display/grouping only)
#   parser: (scrape only) name of the parser function in scrapers.py
#
# Optional keys:
#   enabled: false        keep the entry but do not fetch it (broken/unverified)
#   default_themes: [..]  themes always given to the source's items (intelligence,
#                         military, energy_industry). Use it for sources that are
#                         on-topic by nature: no keyword needed. See fetch.py.
#   initial_limit: N      on a source's first fetch keep only its N latest items
#   max_pages: N          (scrape) pages to read, for parsers that paginate
#   stale_after_days: N   weekly health alert if the newest item is older (default 90)
#   require_report: true  keep only items that look like a report/study
#   verify_ssl: false / allowed_domains: [..]   (see fetch.py / bluesky.py)
#
# After adding a source, run: python scripts/validate_sources.py
# to confirm it actually returns items before trusting it.
# ==============================================================================

# --- Substacks -----------------------------------------------------------
# Substack ALWAYS has a feed at https://<name>.substack.com/feed
# Add new ones here whenever you find a relevant one.
- name: "Le Grand Continent"
  type: rss
  url: "https://legrandcontinent.eu/fr/feed/"
  region: eu

- name: "Sinocism"
  type: rss
  url: "https://sinocism.com/feed"
  region: us

- name: "Project OSINT"
  type: rss
  url: "https://projectosint.substack.com/feed"
  region: other
  default_themes: [intelligence]
  # "OSINT made simple": weekly. Feed checked. On-topic by nature, so it
  # bypasses the keyword filter (its titles contain no classic keywords).

- name: "Missile Matters" 
  type: rss 
  url: "https://missilematters.substack.com/feed"
  region: eu 
  default_themes: [military]

# --- France ----------------------------------------------------------------
- name: "IFRI"
  type: scrape
  url: "https://www.ifri.org/fr/publications"
  parser: ifri
  region: fr

- name: "Portail de l'IE"
  type: rss
  url: "https://www.portail-ie.fr/feed/"
  region: fr
  # Official feed, linked from the site itself. Covers ALL topics (cyber,
  # blockchain, law...) -- the keyword filter narrows it to your themes.

- name: "Portail de l'IE (Défense, armement & renseignement)"
  enabled: false   # redundant: the main feed above already carries every category,
                   # and this category feed has been silent since June (false alarms)
  type: rss
  url: "https://www.portail-ie.fr/category/univers/defense-industrie-de-larmement-et-renseignement/feed/"
  region: fr
  # Category feed, so defense/intelligence pieces don't get pushed out of the
  # main feed's 10-item window between weekly runs (the site posts daily).
  # Standard WordPress pattern, not yet confirmed -- validate before trusting.

- name: "FRS (Fondation pour la Recherche Stratégique)"
  type: rss
  url: "https://www.frstrategie.org/rss.xml"
  region: fr
  verify_ssl: false  # their site's SSL cert chain fails verification; safe for read-only RSS
  enabled: false
  # DISABLED: this feed path returns 404 (it has since the beginning). Find the
  # real feed URL (look for the RSS link in the site footer), then set enabled: true.

- name: "IRSEM"
  type: scrape
  url: "https://www.irsem.fr/publications"
  parser: irsem
  region: fr
  max_pages: 1            # page 1 holds the latest ~12 publications; enough for a daily fetch
  initial_limit: 6
  stale_after_days: 60
  # IRSEM's own category labels decide the theme (Défense/Sécurité/Stratégie/
  # Influence -> Défense, Renseignement -> Renseignement, Énergie/Espace ->
  # Énergie & Infrastructures). Categories below are ignored.
  skip_categories: [droit, société, histoire, environnement]
  # No RSS feed. Scraper written from the listing's text layout; untested live.

