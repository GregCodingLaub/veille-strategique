# ==============================================================================
# SOURCES CONFIG — add or remove sources here. No code changes needed for RSS.
# ==============================================================================
# Each source needs:
#   name:   display name
#   type:   "rss"    -> url must point directly to an RSS/Atom feed
#           "scrape" -> url is a listing page; "parser" must match a function
#                       name in scripts/scrapers.py (custom code required)
#   url:    the feed URL (rss) or listing page URL (scrape)
#   region: fr | eu | us | other   (for display/grouping only)
#   parser: (scrape only) name of the parser function in scrapers.py
#
# After adding a source, run: python scripts/validate_sources.py
# to confirm it actually returns items before trusting it.
# ==============================================================================

# --- Substacks -----------------------------------------------------------
# Substack ALWAYS has a feed at https://<name>.substack.com/feed
# Add new ones here whenever you find a relevant one.
