# --- Intelligence: journals and institutions ---------------------------------
- name: "CIA - Studies in Intelligence"
  type: scrape
  url: "https://www.cia.gov/resources/csi/studies-in-intelligence/"
  parser: cia_csi
  region: us
  default_themes: [intelligence]
  initial_limit: 4
  stale_after_days: 150   # quarterly journal: no alert before ~5 months of silence
  # Quarterly journal: one newsletter line per new issue, linking to the issue
  # page (table of contents + PDF). No RSS feed exists. Scraper written from the
  # page's content, not yet run against the live site: run validate_sources.py.

