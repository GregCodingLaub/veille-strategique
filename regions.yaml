# ==============================================================================
# REGIONS — what an article is ABOUT (its subject), used to group the
# newsletters and the website by geographic area. Not to be confused with a
# source's own "region:" in sources.yaml (the institution's home base, shown as
# the small FR / EU / US tag).
#
# Matching: same rules as keywords.yaml (whole words, accent/case-insensitive,
# plural-tolerant). The item goes to the region with the MOST distinct hits;
# ties are resolved in the order of REGION_ORDER in scripts/common.py. The
# capitalised tokens "US", "USA", "U.S." are recognised separately (code).
# No hit at all -> the publisher's own region, else "other".
# Region keys MUST match REGION_ORDER (checked by scripts/check_config.py).
# ==============================================================================

