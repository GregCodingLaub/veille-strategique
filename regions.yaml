# ==============================================================================
# REGIONS CONFIG — classifies what an article is ABOUT (its subject), not
# where the publishing institution is based. Used to group the newsletter
# and website by geographic area.
#
# This is separate from a source's own "region:" field in sources.yaml,
# which reflects the INSTITUTION's home base (shown as a small perspective
# tag next to each item, e.g. "[EU]") -- a France-based source can easily
# write about the US, and vice versa.
#
# Order matters: an item is assigned to the FIRST region below whose
# keywords match. Put more specific regions before broader ones if you add
# new categories. Items matching none of these fall into "other".
# ==============================================================================

