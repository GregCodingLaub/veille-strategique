name: Veille Stratégique

on:
  schedule:
    # Every day 06:00 UTC: collect new publications.
    # On Mondays the same run then sends the three newsletters (official).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch = collecte seule · test = collecte + envoi de TEST à vous seul (calendrier intact) · official = envoi officiel (pairs inclus, enregistré)"
        type: choice
        options: [test, fetch, official]
        default: test
      reset_source:
        description: "Optionnel : nom exact d'une source dont on efface les publications archivées avant la collecte (elle sera réimportée proprement). Ex. : IRSEM"
        type: string
        default: ""

permissions:
  contents: write

# Never two runs at once (they would both rewrite data/ and conflict on push).
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  run-veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check configuration
        run: python scripts/check_config.py

      - name: Reset one source's archive (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.reset_source != ''
        env:
          RESET_SOURCE: ${{ inputs.reset_source }}
        run: python scripts/backfill_items.py --apply --drop-source "$RESET_SOURCE"

      - name: Fetch & filter sources
        run: python scripts/fetch.py

      - name: Decide what to send
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(date -u +%u)" = "1" ]; then echo "send=official" >> "$GITHUB_OUTPUT"; else echo "send=none" >> "$GITHUB_OUTPUT"; fi
          else
            case "${{ inputs.mode }}" in
              official) echo "send=official" >> "$GITHUB_OUTPUT" ;;
              fetch)    echo "send=none" >> "$GITHUB_OUTPUT" ;;
              *)        echo "send=test" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Send newsletters
        if: steps.mode.outputs.send != 'none'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RECIPIENTS_CSV_URL: ${{ secrets.RECIPIENTS_CSV_URL }}
          SIGNUP_FORM_URL: ${{ secrets.SIGNUP_FORM_URL }}
        run: python scripts/send_newsletter.py ${{ steps.mode.outputs.send == 'test' && '--test' || '' }}

      - name: Build static site
        if: always()
        env:
          SIGNUP_FORM_URL: ${{ secrets.SIGNUP_FORM_URL }}
        run: python scripts/build_site.py

      # Runs even if a send failed: state saved after each theme must not be lost,
      # otherwise the next run would send the same edition again.
      - name: Commit updated data & site
        if: always()
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/ docs/index.html
          git diff --quiet --cached || git commit -m "Update veille data [automated]"
          git pull --rebase --autostash
          git push
