# ==============================================================================
# KEYWORDS — what counts as "relevant" for each newsletter.
#
# An item is kept if its TITLE + SUMMARY (cleaned of HTML) matches any keyword
# of a theme. It then appears in that theme's newsletter. One item can match
# several themes.
#
# How matching works (see scripts/common.py):
#   - whole words/phrases only: "cia" never matches inside "social"
#   - case-, accent- and curly-quote-insensitive: "Défense" = "defense"
#   - plural-tolerant: "drone" also matches "drones", "armée" -> "armées"
#     (so list the SINGULAR form only)
# Theme keys MUST match THEME_ORDER in scripts/common.py (checked in CI by
# scripts/check_config.py). Changes apply to items fetched after the change;
# run scripts/backfill_items.py to re-evaluate the existing archive.
#
# exclude_technical: items matching any of these are dropped even if they match
# a theme (too technical, promotional, or just an event announcement).
# ==============================================================================

