name: Check

on:
  push:
    paths: ["sources.yaml", "keywords.yaml", "regions.yaml", "scripts/**", "tests/**", "requirements*.txt"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python scripts/check_config.py
      - run: pytest -q
